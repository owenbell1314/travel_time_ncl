<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newcastle &amp; Tyne and Wear Travel Time Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="controls">
    <h1>Travel Time Map — Tyne and Wear</h1>
    <div class="control-row">
      <label class="control">
        <span class="control-label">Start point</span>
        <select id="start-point-select"></select>
      </label>
      <label class="control">
        <span class="control-label">Transport mode</span>
        <select id="mode-select"></select>
      </label>
      <span id="status-message" class="status-message" role="status" aria-live="polite"></span>
    </div>
  </header>
  <main id="map"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/app.js"></script>
</body>
</html>
